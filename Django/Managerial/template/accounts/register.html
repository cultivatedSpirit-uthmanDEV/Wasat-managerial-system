
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Wasat Managerial</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .auth-card {
            background: #f2f1f1;
            border: 1px solid #f4f3f2;
            border-radius: 12px;
            padding: 35px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 24px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #707a8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #dce1e9;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #b08d57;
        }

        .help-text {
            margin-top: 5px;
            font-size: 11px;
            color: #7b8495;
        }

        .field-error {
            margin-top: 5px;
            color: #b42318;
            font-size: 12px;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #b08d57;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .register-btn:hover {
            opacity: 0.92;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #b08d57;
        }

        .auth-footer a {
            color: #b08d57;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="brand">
            <h1>Wasat Managerial</h1>
            <p>Create your management account</p>
        </div>


        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    {{ field.label_tag }}

                    {{ field }}

                    {% if field.help_text %}
                        <div class="help-text">
                            {{ field.help_text }}
                        </div>
                    {% endif %}

                    {% for error in field.errors %}
                        <div class="field-error">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}


            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>


        <div class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">
                Sign in
            </a>
        </div>

    </div>

</div>

</body>
</html>
```
