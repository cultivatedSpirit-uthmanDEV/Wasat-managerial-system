{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Wasat Managerial{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>

<body>

<div class="app-layout">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <h2>Wasatasoke <span>Managerial</span></h2>
            <p>Fashion Operations</p>
        </div>


        <!-- MAIN -->

        <div class="nav-section">

            <div class="nav-title">
                Main
            </div>

            <a
                href="{% url 'dashboard' %}"
                class="nav-link"
            >
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>


            <a
                href="{% url 'order-list' %}"
                class="nav-link"
            >
                <span class="nav-icon">□</span>
                Orders
            </a>


            <a
                href="{% url 'customer-list' %}"
                class="nav-link"
            >
                <span class="nav-icon">♙</span>
                Customers
            </a>


            <a
                href="{% url 'worker-list' %}"
                class="nav-link"
            >
                <span class="nav-icon">♧</span>
                Workers
            </a>

        </div>


        <!-- OPERATIONS -->

        <div class="nav-section">

            <div class="nav-title">
                Operations
            </div>


            <a
                href="{% url 'order-list' %}"
                class="nav-link"
            >
                <span class="nav-icon">◈</span>
                Processing
            </a>


            <a
                href="{% url 'delivery-lists' %}"
                class="nav-link"
            >
                <span class="nav-icon">◇</span>
                Deliveries
            </a>

        </div>


        <!-- ACCOUNT -->

        <div class="nav-section">

            <div class="nav-title">
                Account
            </div>


            <a
                href="{% url 'logout' %}"
                class="nav-link"
            >
                <span class="nav-icon">↪</span>
                Logout
            </a>

        </div>

    </aside>


    <!-- SIDEBAR OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main-content">


        <!-- MOBILE HEADER -->

        <div class="mobile-header">

            <div class="mobile-brand">
                Wasat <span>Managerial</span>
            </div>


            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Open navigation"
                aria-expanded="false"
            >
                ☰
            </button>

        </div>


        {% block content %}
        {% endblock %}

    </main>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

    const menuToggle = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");


    function openSidebar() {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("active");

        menuToggle.setAttribute("aria-expanded", "true");
    }


    function closeSidebar() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("active");

        menuToggle.setAttribute("aria-expanded", "false");
    }


    menuToggle.addEventListener("click", function () {

        if (sidebar.classList.contains("open")) {
            closeSidebar();
        } else {
            openSidebar();
        }

    });


    sidebarOverlay.addEventListener("click", function () {
        closeSidebar();
    });


    // Close the mobile sidebar after selecting a link.

    const navLinks = sidebar.querySelectorAll(".nav-link");

    navLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            if (window.innerWidth <= 800) {
                closeSidebar();
            }

        });

    });

</script>


{% block extra_js %}
{% endblock %}

</body>
</html>
