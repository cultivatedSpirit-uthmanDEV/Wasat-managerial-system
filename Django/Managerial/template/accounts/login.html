{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Wasat Managerial</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: #f7f6f5;
            border: 1px solid #e4e8ef;
            border-radius: 12px;
            padding: 35px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            margin: 0;
            font-size: 24px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #707a8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #dce1e9;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #b08d57;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #b08d57;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.92;
        }

        .error {
            margin-bottom: 18px;
            padding: 11px;
            border-radius: 7px;
            background: #fff0f0;
            color: #b42318;
            font-size: 13px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #707a8d;
        }

        .auth-footer a {
            color: #b08d57;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="brand">
            <h1>Wasat Managerial</h1>
            <p>Sign in to your management dashboard</p>
        </div>


        {% if form.errors %}
            <div class="error">
                Your username or password is incorrect.
            </div>
        {% endif %}


        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                >
            </div>


            <div class="form-group">
                <label for="id_password">Password</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >
            </div>


            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>


        <div class="auth-footer">
            Don't have an account?
            <a href="{% url 'register' %}">
                Create one
            </a>
        </div>

    </div>

</div>

</body>
</html>
```
